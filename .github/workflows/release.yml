name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Run tests
        run: cargo test --locked

      - name: Build macOS binaries
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/adb-qr \
            target/x86_64-apple-darwin/release/adb-qr \
            -output dist/adb-qr
          chmod +x dist/adb-qr
          dist/adb-qr --version

      - name: Package release
        run: |
          tar -C dist -czf adb-qr-macos-universal.tar.gz adb-qr
          shasum -a 256 adb-qr-macos-universal.tar.gz > adb-qr-macos-universal.tar.gz.sha256

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=v${VERSION}-main.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=adb-qr ${VERSION} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        run: |
          gh release create "$RELEASE_TAG" \
            adb-qr-macos-universal.tar.gz \
            adb-qr-macos-universal.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --generate-notes \
            --prerelease
