name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Run tests
        run: cargo test --locked

      - name: Determine release metadata
        id: release
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v${VERSION}-main.${GITHUB_RUN_NUMBER}"
          PRERELEASE=true
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" != "v${VERSION}" ]]; then
              echo "Stable release tag must match Cargo.toml: v${VERSION}" >&2
              exit 1
            fi
            PRERELEASE=false
          fi
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=adb-qr ${VERSION} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          echo "archive=adb-qr-${TAG}-macos-universal.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build macOS binaries
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p release
          lipo -create \
            target/aarch64-apple-darwin/release/adb-qr \
            target/x86_64-apple-darwin/release/adb-qr \
            -output release/adb-qr
          chmod +x release/adb-qr
          release/adb-qr --version

      - name: Package release
        env:
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          cp README.md LICENSE release/
          tar -C release -czf "$RELEASE_ARCHIVE" adb-qr README.md LICENSE
          shasum -a 256 "$RELEASE_ARCHIVE" > "${RELEASE_ARCHIVE}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_ARCHIVE" \
            "${RELEASE_ARCHIVE}.sha256" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --generate-notes \
            --prerelease="$PRERELEASE"
