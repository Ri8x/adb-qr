name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and test the macOS package
        run: |
          brew tap ri8x/adb-qr "$GITHUB_WORKSPACE"
          brew install ri8x/adb-qr/adb-qr
          brew test ri8x/adb-qr/adb-qr
          adb-qr --version
