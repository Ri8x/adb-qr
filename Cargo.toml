[package]
name = "adb-qr"
version = "0.1.0"
edition = "2021"
description = "Terminal-first ADB wireless debugging QR and pairing helper"
license = "MIT"
repository = "https://github.com/Ri8x/adb-qr"
homepage = "https://github.com/Ri8x/adb-qr"
readme = "README.md"
keywords = ["adb", "android", "qr", "wireless-debugging", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
png = "0.17"
qrcodegen = "1.8"
rand = "0.8"
which = "7.0"

[dev-dependencies]
tempfile = "3.15"
